
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Currency Converter</h1>
    <p>Convert currencies using live exchange rates</p>

    <label>Enter Amount</label>
    <input type="number" id="amount" value="100" min="0" step="any">

    <label>From Currency</label>
    <select id="from">
        <option value="INR">INR - Indian Rupee</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="SGD">SGD - Singapore Dollar</option>
        <option value="AED">AED - UAE Dirham</option>
        <option value="CHF">CHF - Swiss Franc</option>
        <option value="CNY">CNY - Chinese Yuan</option>
        <option value="NZD">NZD - New Zealand Dollar</option>
    </select>

    <label>To Currency</label>
    <select id="to">
        <option value="USD">USD - US Dollar</option>
        <option value="INR">INR - Indian Rupee</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="SGD">SGD - Singapore Dollar</option>
        <option value="AED">AED - UAE Dirham</option>
        <option value="CHF">CHF - Swiss Franc</option>
        <option value="CNY">CNY - Chinese Yuan</option>
        <option value="NZD">NZD - New Zealand Dollar</option>
    </select>

    <button onclick="swapCurrencies()" class="swap-btn">
        ⇅ Swap Currencies
    </button>

    <button onclick="convertCurrency()">
        Convert Currency
    </button>

    <div id="result">
        Your converted amount will appear here.
    </div>

    <div class="history-section">

        <h2>Conversion History</h2>

        <button onclick="clearHistory()" class="clear-btn">
            Clear History
        </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Amount</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Converted</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="historyBody">
                </tbody>
            </table>
        </div>

        <p id="emptyHistory">No conversion history available.</p>

    </div>

</div>

<script>

async function convertCurrency() {

    const amount = document.getElementById("amount").value;
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;

    const result = document.getElementById("result");

    if (amount === "" ||
        !Number.isFinite(Number(amount)) ||
        Number(amount) < 0) {

        result.innerText = "Please enter a valid amount.";
        return;
    }

    result.innerText = "Converting...";

    try {

        const url =
            `http://localhost:8083/convert?amount=${encodeURIComponent(amount)}&from=${from}&to=${to}`;

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Conversion failed");
        }

        result.innerHTML = `
            <h3>Conversion Result</h3>
            <h2>${data.amount} ${data.from} =
            ${data.converted.toFixed(2)} ${data.to}</h2>
            <p>Exchange Rate: 1 ${data.from} =
            ${data.rate} ${data.to}</p>
        `;

        saveHistory(
            data.amount,
            data.from,
            data.to,
            data.converted.toFixed(2)
        );

    } catch (error) {

        result.innerText =
            "Unable to convert. Please check the server and internet connection.";

        console.error(error);
    }
}


// Save conversion history

function saveHistory(amount, from, to, converted) {

    let history = JSON.parse(
        localStorage.getItem("conversionHistory") || "[]"
    );

    history.unshift({
        amount: amount,
        from: from,
        to: to,
        converted: converted,
        date: new Date().toLocaleString()
    });

    // Keep the latest 50 conversions
    history = history.slice(0, 50);

    localStorage.setItem(
        "conversionHistory",
        JSON.stringify(history)
    );

    displayHistory();
}


// Display conversion history

function displayHistory() {

    let history = JSON.parse(
        localStorage.getItem("conversionHistory") || "[]"
    );

    const body = document.getElementById("historyBody");
    const empty = document.getElementById("emptyHistory");

    body.innerHTML = "";

    history.forEach(item => {

        const row = document.createElement("tr");

        [
            item.amount,
            item.from,
            item.to,
            item.converted,
            item.date
        ].forEach(value => {

            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);

        });

        body.appendChild(row);

    });

    empty.style.display =
        history.length === 0 ? "block" : "none";
}


// Clear history

function clearHistory() {

    if (confirm("Are you sure you want to clear conversion history?")) {

        localStorage.removeItem("conversionHistory");
        displayHistory();

    }
}


// Swap currencies

function swapCurrencies() {

    const from = document.getElementById("from");
    const to = document.getElementById("to");

    const temp = from.value;

    from.value = to.value;
    to.value = temp;
}


// Load history when website opens

window.addEventListener("DOMContentLoaded", displayHistory);

</script>

</body>
</html>
